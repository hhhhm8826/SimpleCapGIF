name: build

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Fetch and verify FFmpeg
        shell: pwsh
        run: |
          ./scripts/fetch-ffmpeg.ps1
          ./scripts/verify-ffmpeg.ps1
      - name: Restore
        run: dotnet restore SimpleCapGIF.sln
      - name: Build
        run: dotnet build SimpleCapGIF.sln -c Release --no-restore
      - name: Test
        run: dotnet test SimpleCapGIF.sln -c Release --no-build
      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: SimpleCapGIF-v0.1-win-x64
          path: artifacts/package/SimpleCapGIF-v0.1-win-x64.zip
